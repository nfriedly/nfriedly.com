name: Build Static Site

on: pull_request

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # first checkout the source
    - uses: actions/checkout@v6
    - name: Build and check
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - run: npm ci
    - run: npm run build
    - run: npm test


